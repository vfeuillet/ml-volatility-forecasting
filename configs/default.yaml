data:
  start: "2005-01-01"
  end: "2025-12-31"          # inclusive
  cache_dir: "data/raw"
  benchmark: "SPY"
  tickers: [SPY, AAPL, MSFT, INTC, CSCO, GOOGL, AMZN, HD, MCD, PG, KO, WMT,
            JPM, BAC, GS, XOM, CVX, JNJ, PFE, UNH, CAT, BA, NEE]
  vix: "^VIX"
  risk_free: "^IRX"

target:
  horizon: 5                 # trading days
  annualization: 252
  variance_floor: 1.0e-8     # daily variance floor (GK can be slightly negative)

seed: 42

walkforward:
  test_start: "2012-01-01"
  refit_every: 21            # trading days between re-estimations

gbm:
  features: &ml_features [log_rv_d, log_rv_w, log_rv_m, ret_1, ret_5, ret_22, abs_ret_1, abs_ret_5,
             neg_ret_1, log_park_1, log_park_5, log_vix_lag, vix_chg_5_lag,
             log_volume_ratio, log_overnight_5]
  har_only_features: [log_rv_d, log_rv_w, log_rv_m]   # ablation
  val_days: 252              # time-ordered validation set at the end of each training window
  max_iter: 2000
  n_iter_no_change: 20
  # Chosen once by scripts/tune_gbm.py on 2009-2011 (never on the test period), then frozen.
  params:                    # val QLIKE 0.2566 (grid range 0.2566-0.2743, see reports/tables/gbm_tuning.csv)
    learning_rate: 0.1
    max_leaf_nodes: 31
    min_samples_leaf: 100
    l2_regularization: 0.0
  tuning:
    train_end: "2008-12-31"
    val_end: "2011-12-31"
    grid:
      learning_rate: [0.03, 0.1]
      max_leaf_nodes: [15, 31]
      min_samples_leaf: [100, 500]
      l2_regularization: [0.0, 1.0]

lstm:
  features: *ml_features     # same 15 predictors as the GBM
  # Chosen by scripts/tune_lstm.py on 2009-2011 (val QLIKE 0.318, grid 0.318-0.330), then frozen.
  seq_len: 22
  hidden: 32
  dropout: 0.1
  lr: 0.001
  batch_size: 512
  max_epochs: 40
  patience: 5
  val_days: 252
  seeds: [0, 1, 2]           # forecasts are averaged over seeds
  num_threads: 8
  tuning:
    train_end: "2008-12-31"
    val_end: "2011-12-31"
    grid:
      seq_len: [22, 60]
      hidden: [16, 32]

evaluation:
  # harx_ticker / harx_pooled were specified as controls before any of them was run.
  main_models: [naive, garch, gjr, har, harx_ticker, gbm, lstm]
  ablation_models: [har, har_pooled, harx_ticker, harx_pooled, gbm_har_feats, gbm, lstm]
  dm_references: [har, garch, harx_ticker]
  regimes:
    full: ["2012-01-01", "2025-12-31"]
    calm_2015_2019: ["2015-01-01", "2019-12-31"]
    covid_2020: ["2020-01-01", "2020-12-31"]
    inflation_2022: ["2022-01-01", "2022-12-31"]

backtest:
  asset: SPY
  target_vol: 0.10
  max_leverage: 2.0
  cost_bps: 5                # per unit of turnover
  strategies: [naive, garch, gjr, har, harx_ticker, gbm, lstm]
